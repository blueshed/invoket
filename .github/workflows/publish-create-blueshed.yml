name: Publish create-blueshed to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "create-blueshed-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install

      - run: bun test

      # Smoke: make an app the way a user does, from the paintbrush template on GitHub,
      # and check it is paintbrush's and typechecks
      - run: |
          bun packages/create-blueshed/cli.ts /tmp/smoke-app
          test -f /tmp/smoke-app/src/server.ts
          test -f /tmp/smoke-app/.claude/skills/evolve/SKILL.md
          cd /tmp/smoke-app && bun run typecheck
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip if this version is already on npm
        id: check
        working-directory: packages/create-blueshed
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ "$(npm view "$PKG@$VER" version 2>/dev/null)" = "$VER" ]; then
            echo "$PKG@$VER already published — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        working-directory: packages/create-blueshed
        run: npm publish --provenance --access public
